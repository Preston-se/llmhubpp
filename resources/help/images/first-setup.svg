<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" role="img" aria-labelledby="first-setup-title first-setup-desc"><title id="first-setup-title">按实际条件选择模型</title><desc id="first-setup-desc">先问用途、隐私和预算，再验证服务；不自动安装或迁移。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#73d9cb"/></marker></defs><rect width="640" height="368" rx="14" fill="#19292f"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="24" y="38" font-size="24" font-weight="600" fill="#f2f7f8">按实际条件选择模型</text><rect x="24" y="66" width="592" height="52" rx="10" fill="#263f47"/><text x="44" y="99" fill="#f2f7f8" font-size="19">先了解任务与现有配置，解释选择的影响</text><path d="M320 120V137H116V153" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="164" width="184" height="104" rx="10" fill="#263f47" stroke="#577980"/><text x="36" y="196" fill="#f2f7f8" font-size="19" font-weight="600">本机</text><text x="36" y="224" fill="#c4d6dc" font-size="15">已有服务；速度看硬件</text><path d="M320 120V137H320V153" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="228" y="164" width="184" height="104" rx="10" fill="#263f47" stroke="#577980"/><text x="240" y="196" fill="#f2f7f8" font-size="19" font-weight="600">局域网</text><text x="240" y="224" fill="#c4d6dc" font-size="15">明确地址和信任范围</text><path d="M320 120V137H524V153" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="432" y="164" width="184" height="104" rx="10" fill="#263f47" stroke="#577980"/><text x="444" y="196" fill="#f2f7f8" font-size="19" font-weight="600">云端 API</text><text x="444" y="224" fill="#c4d6dc" font-size="15">核对外发、价格与权限</text><text x="24" y="314" fill="#9be4d9" font-size="17">明确范围 → 小样本检查 → 按真实结果再调整</text><text x="24" y="345" fill="#adc5cb" font-size="14">已有用户配置和数据优先保留。</text></g></svg>

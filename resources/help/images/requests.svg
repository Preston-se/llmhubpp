<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" role="img" aria-labelledby="requests-title requests-desc"><title id="requests-title">先分清费用与隐私边界</title><desc id="requests-desc">托管联网查询无法可靠预检或限价时，保护策略会阻止请求。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#73d9cb"/></marker></defs><rect width="640" height="368" rx="14" fill="#19292f"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="24" y="38" font-size="24" font-weight="600" fill="#f2f7f8">先分清费用与隐私边界</text><rect x="24" y="66" width="592" height="52" rx="10" fill="#263f47"/><text x="44" y="99" fill="#f2f7f8" font-size="19">先了解任务与现有配置，解释选择的影响</text><path d="M320 120V137H116V153" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="164" width="184" height="104" rx="10" fill="#263f47" stroke="#577980"/><text x="36" y="196" fill="#f2f7f8" font-size="19" font-weight="600">受管 HTTP</text><text x="36" y="224" fill="#c4d6dc" font-size="15">预检、用量记录和预算</text><path d="M320 120V137H320V153" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="228" y="164" width="184" height="104" rx="10" fill="#263f47" stroke="#577980"/><text x="240" y="196" fill="#f2f7f8" font-size="19" font-weight="600">外部 CLI / MCP</text><text x="240" y="224" fill="#c4d6dc" font-size="15">服务内部费用和外发另计</text><path d="M320 120V137H524V153" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="432" y="164" width="184" height="104" rx="10" fill="#263f47" stroke="#577980"/><text x="444" y="196" fill="#f2f7f8" font-size="19" font-weight="600">实时语音 / 二进制</text><text x="444" y="224" fill="#c4d6dc" font-size="15">独立计费；文字脱敏有边</text><text x="444" y="246" fill="#c4d6dc" font-size="15">界</text><text x="24" y="314" fill="#9be4d9" font-size="17">明确范围 → 小样本检查 → 按真实结果再调整</text><text x="24" y="345" fill="#adc5cb" font-size="14">已有用户配置和数据优先保留。</text></g></svg>

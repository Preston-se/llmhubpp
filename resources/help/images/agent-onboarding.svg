<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" role="img" aria-labelledby="agent-onboarding-title agent-onboarding-desc"><title id="agent-onboarding-title">协作配置先问五类问题</title><desc id="agent-onboarding-desc">已知答案不重复问；普通已授权范围内配置不反复确认。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#73d9cb"/></marker></defs><rect width="640" height="368" rx="14" fill="#19292f"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="24" y="38" font-size="24" font-weight="600" fill="#f2f7f8">协作配置先问五类问题</text><path d="M298 120H326M480 169V198M344 266H314" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="72" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="40" y="101" fill="#9be4d9" font-size="14">01</text><text x="40" y="127" fill="#f2f7f8" font-size="20" font-weight="600">用途与模型位置</text><text x="40" y="149" fill="#c4d6dc" font-size="14">沿用已有服务，不自动安装</text><rect x="344" y="72" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="360" y="101" fill="#9be4d9" font-size="14">02</text><text x="360" y="127" fill="#f2f7f8" font-size="20" font-weight="600">隐私与预算</text><text x="360" y="149" fill="#c4d6dc" font-size="14">解释不同选择的能力与费用影响</text><rect x="344" y="216" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="360" y="245" fill="#9be4d9" font-size="14">03</text><text x="360" y="271" fill="#f2f7f8" font-size="20" font-weight="600">资料范围与既有索引</text><text x="360" y="293" fill="#c4d6dc" font-size="14">保留原件、索引和自定义能力</text><rect x="24" y="216" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="40" y="245" fill="#9be4d9" font-size="14">04</text><text x="40" y="271" fill="#f2f7f8" font-size="20" font-weight="600">短提案与验证计划</text><text x="40" y="293" fill="#c4d6dc" font-size="14">推荐有条件，高级项按需展开</text><text x="24" y="346" fill="#adc5cb" font-size="14">按顺序核对；不把上一层结果当作下一层成功。</text></g></svg>

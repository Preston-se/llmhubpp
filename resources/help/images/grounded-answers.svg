<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" role="img" aria-labelledby="grounded-answers-title grounded-answers-desc"><title id="grounded-answers-title">从候选到可核对的引用</title><desc id="grounded-answers-desc">没有引用的候选不自动列为来源；模型仍可能错引，需要回看原文。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#73d9cb"/></marker></defs><rect width="640" height="368" rx="14" fill="#19292f"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="24" y="38" font-size="24" font-weight="600" fill="#f2f7f8">从候选到可核对的引用</text><path d="M298 120H326M480 169V198M344 266H314" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="72" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="40" y="101" fill="#9be4d9" font-size="14">01</text><text x="40" y="127" fill="#f2f7f8" font-size="20" font-weight="600">检索得到候选片段</text><text x="40" y="149" fill="#c4d6dc" font-size="14">候选数量不等于有效来源数量</text><rect x="344" y="72" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="360" y="101" fill="#9be4d9" font-size="14">02</text><text x="360" y="127" fill="#f2f7f8" font-size="20" font-weight="600">模型在回答中引用</text><text x="360" y="149" fill="#c4d6dc" font-size="14">仅匹配实际使用的证据标记</text><rect x="344" y="216" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="360" y="245" fill="#9be4d9" font-size="14">03</text><text x="360" y="271" fill="#f2f7f8" font-size="20" font-weight="600">点击标记查看片段</text><text x="360" y="293" fill="#c4d6dc" font-size="14">窗口跟随位置，可展开所有有效来源</text><rect x="24" y="216" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="40" y="245" fill="#9be4d9" font-size="14">04</text><text x="40" y="271" fill="#f2f7f8" font-size="20" font-weight="600">打开原文核对</text><text x="40" y="293" fill="#c4d6dc" font-size="14">尝试定位；无法唯一匹配只打开</text><text x="24" y="346" fill="#adc5cb" font-size="14">按顺序核对；不把上一层结果当作下一层成功。</text></g></svg>

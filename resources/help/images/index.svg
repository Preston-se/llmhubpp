<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" role="img" aria-labelledby="index-title index-desc"><title id="index-title">从一个问题出发</title><desc id="index-desc">每一步都有可核对的结果；已有配置、模型、索引和自定义能力优先保留。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#73d9cb"/></marker></defs><rect width="640" height="368" rx="14" fill="#19292f"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="24" y="38" font-size="24" font-weight="600" fill="#f2f7f8">从一个问题出发</text><path d="M298 120H326M480 169V198M344 266H314" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="72" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="40" y="101" fill="#9be4d9" font-size="14">01</text><text x="40" y="127" fill="#f2f7f8" font-size="20" font-weight="600">选择明确模型</text><text x="40" y="149" fill="#c4d6dc" font-size="14">本地或云端，先问隐私与预算</text><rect x="344" y="72" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="360" y="101" fill="#9be4d9" font-size="14">02</text><text x="360" y="127" fill="#f2f7f8" font-size="20" font-weight="600">准备可读资料</text><text x="360" y="149" fill="#c4d6dc" font-size="14">Markdown 可直接使用；复杂</text><text x="360" y="166" fill="#c4d6dc" font-size="14">文件先解析</text><rect x="344" y="216" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="360" y="245" fill="#9be4d9" font-size="14">03</text><text x="360" y="271" fill="#f2f7f8" font-size="20" font-weight="600">检索并核对证据</text><text x="360" y="293" fill="#c4d6dc" font-size="14">引用指向本次实际使用的资料</text><rect x="24" y="216" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="40" y="245" fill="#9be4d9" font-size="14">04</text><text x="40" y="271" fill="#f2f7f8" font-size="20" font-weight="600">继续阅读与练习</text><text x="40" y="293" fill="#c4d6dc" font-size="14">回看原文，再决定下一步任务</text><text x="24" y="346" fill="#adc5cb" font-size="14">按顺序核对；不把上一层结果当作下一层成功。</text></g></svg>

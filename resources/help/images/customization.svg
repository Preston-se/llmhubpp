<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" role="img" aria-labelledby="customization-title customization-desc"><title id="customization-title">按场景定制，不抢占偏好</title><desc id="customization-desc">帮助入口、聊天历史与语音发送倾向都可按需要调整。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#73d9cb"/></marker></defs><rect width="640" height="368" rx="14" fill="#19292f"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="24" y="38" font-size="24" font-weight="600" fill="#f2f7f8">按场景定制，不抢占偏好</text><path d="M298 120H326M480 169V198M344 266H314" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="72" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="40" y="101" fill="#9be4d9" font-size="14">01</text><text x="40" y="127" fill="#f2f7f8" font-size="20" font-weight="600">选择阅读场景</text><text x="40" y="149" fill="#c4d6dc" font-size="14">编辑、预览、PDF 或 EPUB</text><rect x="344" y="72" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="360" y="101" fill="#9be4d9" font-size="14">02</text><text x="360" y="127" fill="#f2f7f8" font-size="20" font-weight="600">配置动作与顺序</text><text x="360" y="149" fill="#c4d6dc" font-size="14">隐藏、改名、平铺或子菜单</text><rect x="344" y="216" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="360" y="245" fill="#9be4d9" font-size="14">03</text><text x="360" y="271" fill="#f2f7f8" font-size="20" font-weight="600">设置快捷键前查冲突</text><text x="360" y="293" fill="#c4d6dc" font-size="14">新命令默认不绑定，保留已有键位</text><rect x="24" y="216" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="40" y="245" fill="#9be4d9" font-size="14">04</text><text x="40" y="271" fill="#f2f7f8" font-size="20" font-weight="600">在真实入口验证</text><text x="40" y="293" fill="#c4d6dc" font-size="14">焦点、场景和冲突分别核对</text><text x="24" y="346" fill="#adc5cb" font-size="14">按顺序核对；不把上一层结果当作下一层成功。</text></g></svg>

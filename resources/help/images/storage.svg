<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" role="img" aria-labelledby="storage-title storage-desc"><title id="storage-title">继承与独立目录</title><desc id="storage-desc">模型、原件、索引和聊天不是普通配置包的迁移内容。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#73d9cb"/></marker></defs><rect width="640" height="368" rx="14" fill="#19292f"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="24" y="38" font-size="24" font-weight="600" fill="#f2f7f8">继承与独立目录</text><path d="M298 120H326M480 169V198M344 266H314" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="72" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="40" y="101" fill="#9be4d9" font-size="14">01</text><text x="40" y="127" fill="#f2f7f8" font-size="20" font-weight="600">先看有效路径</text><text x="40" y="149" fill="#c4d6dc" font-size="14">工作区根目录及当前消费者</text><rect x="344" y="72" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="360" y="101" fill="#9be4d9" font-size="14">02</text><text x="360" y="127" fill="#f2f7f8" font-size="20" font-weight="600">选择继承或独立覆盖</text><text x="360" y="149" fill="#c4d6dc" font-size="14">只改变对应产物的目标位置</text><rect x="344" y="216" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="360" y="245" fill="#9be4d9" font-size="14">03</text><text x="360" y="271" fill="#f2f7f8" font-size="20" font-weight="600">停止任务并检查冲突</text><text x="360" y="293" fill="#c4d6dc" font-size="14">目标已有状态时先处理</text><rect x="24" y="216" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="40" y="245" fill="#9be4d9" font-size="14">04</text><text x="40" y="271" fill="#f2f7f8" font-size="20" font-weight="600">按回执应用再验证</text><text x="40" y="293" fill="#c4d6dc" font-size="14">不自动搬文件，原目录继续保留</text><text x="24" y="346" fill="#adc5cb" font-size="14">按顺序核对；不把上一层结果当作下一层成功。</text></g></svg>

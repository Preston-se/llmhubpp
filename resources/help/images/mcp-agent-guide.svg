<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" role="img" aria-labelledby="mcp-agent-guide-title mcp-agent-guide-desc"><title id="mcp-agent-guide-title">Agent 协作的应用闭环</title><desc id="mcp-agent-guide-desc">纯探测不保存；受管检查可记录验证；内容执行始终需要对应授权。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#73d9cb"/></marker></defs><rect width="640" height="368" rx="14" fill="#19292f"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="24" y="38" font-size="24" font-weight="600" fill="#f2f7f8">Agent 协作的应用闭环</text><path d="M298 120H326M480 169V198M344 266H314" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="72" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="40" y="101" fill="#9be4d9" font-size="14">01</text><text x="40" y="127" fill="#f2f7f8" font-size="20" font-weight="600">状态与核心问题</text><text x="40" y="149" fill="#c4d6dc" font-size="14">补缺项，解释方案和影响</text><rect x="344" y="72" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="360" y="101" fill="#9be4d9" font-size="14">02</text><text x="360" y="127" fill="#f2f7f8" font-size="20" font-weight="600">预览差异及风险</text><text x="360" y="149" fill="#c4d6dc" font-size="14">授权与确认绑定同次预览</text><rect x="344" y="216" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="360" y="245" fill="#9be4d9" font-size="14">03</text><text x="360" y="271" fill="#f2f7f8" font-size="20" font-weight="600">整批事务保存</text><text x="360" y="293" fill="#c4d6dc" font-size="14">逐项报告运行时是否生效</text><rect x="24" y="216" width="272" height="98" rx="10" fill="#263f47" stroke="#577980"/><text x="40" y="245" fill="#9be4d9" font-size="14">04</text><text x="40" y="271" fill="#f2f7f8" font-size="20" font-weight="600">复查与必要的应用</text><text x="40" y="293" fill="#c4d6dc" font-size="14">忙或失败不清 pending，本地</text><text x="40" y="310" fill="#c4d6dc" font-size="14">重载后换连接</text><text x="24" y="346" fill="#adc5cb" font-size="14">按顺序核对；不把上一层结果当作下一层成功。</text></g></svg>

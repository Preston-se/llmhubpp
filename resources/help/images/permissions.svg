<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" role="img" aria-labelledby="permissions-title permissions-desc"><title id="permissions-title">分开核对三层保护</title><desc id="permissions-desc">只读不等于禁止外发；更改保护需要说明影响。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#73d9cb"/></marker></defs><rect width="640" height="368" rx="14" fill="#19292f"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="24" y="38" font-size="24" font-weight="600" fill="#f2f7f8">分开核对三层保护</text><rect x="24" y="66" width="592" height="52" rx="10" fill="#263f47"/><text x="44" y="99" fill="#f2f7f8" font-size="19">先了解任务与现有配置，解释选择的影响</text><path d="M320 120V137H116V153" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="164" width="184" height="104" rx="10" fill="#263f47" stroke="#577980"/><text x="36" y="196" fill="#f2f7f8" font-size="19" font-weight="600">库工具权限</text><text x="36" y="224" fill="#c4d6dc" font-size="15">允许目录、只读与写入</text><path d="M320 120V137H320V153" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="228" y="164" width="184" height="104" rx="10" fill="#263f47" stroke="#577980"/><text x="240" y="196" fill="#f2f7f8" font-size="19" font-weight="600">Safe Guard 代理</text><text x="240" y="224" fill="#c4d6dc" font-size="15">只保护经过此路线的请求</text><path d="M320 120V137H524V153" fill="none" stroke="#73d9cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="432" y="164" width="184" height="104" rx="10" fill="#263f47" stroke="#577980"/><text x="444" y="196" fill="#f2f7f8" font-size="19" font-weight="600">出站隐私</text><text x="444" y="224" fill="#c4d6dc" font-size="15">正文、附件和远端发送策</text><text x="444" y="246" fill="#c4d6dc" font-size="15">略</text><text x="24" y="314" fill="#9be4d9" font-size="17">明确范围 → 小样本检查 → 按真实结果再调整</text><text x="24" y="345" fill="#adc5cb" font-size="14">已有用户配置和数据优先保留。</text></g></svg>
